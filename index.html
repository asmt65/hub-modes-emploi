<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23172F57'/%3E%3Ccircle cx='22' cy='22' r='4' fill='%23F37537'/%3E%3Cpath d='M8 9h12M8 15h12M8 21h6' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Modes d'emploi ASMT 65</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* Identité de l'extranet ASMT : fond bleu en dégradé, cartes blanches très arrondies, accents en dégradé rose→orange, titres bicolores en capitales. Une colonne de cartes ; thème unique, par choix. */
:root{
  --bleu:#2091D0; --bleu-nuit:#0d4d7d; --encre:#1d2b3a; --encre-doux:#8a94a3; --trait:#e3e8ee; --carte:#f7f8fa;
  --rose:#EF599A; --orange:#F37537; --corail:#F0625A; --vert:#60BB46;
  --chaud:linear-gradient(135deg,#EF599A 0%,#F37537 100%);
  --corps:"Lato",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
body{background:linear-gradient(120deg,#2191d0 0%,#14679f 45%,#0d4d7d 100%) fixed;background-color:#14679f;color:var(--encre);font-family:var(--corps);font-size:17px;line-height:1.5;min-height:100vh}
img{max-width:100%;height:auto;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px var(--corail)}
h1:focus,h2:focus{outline:none;box-shadow:none}
/* barre du haut */
header{position:sticky;top:0;z-index:5;padding:14px 16px 0}
.tete{max-width:1000px;margin:0 auto;background:var(--bleu);border-radius:999px;padding:8px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(6,40,70,.28)}
.cherche{flex:1;position:relative;min-width:0}
.cherche input{width:100%;font:inherit;border:0;border-radius:999px;background:#fff;color:var(--encre);padding:11px 46px 11px 22px}
.cherche input::placeholder{color:var(--encre);opacity:.85}
.cherche svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--encre);pointer-events:none}
.marque{border:0;cursor:pointer;background:var(--chaud);color:#fff;font-weight:700;border-radius:999px;padding:11px 26px;white-space:nowrap}
main{max-width:1000px;margin:0 auto;padding:26px 16px 40px;display:flex;flex-direction:column;gap:22px}
footer{max-width:1000px;margin:0 auto;padding:0 16px 30px;color:rgba(255,255,255,.75);font-size:.85rem;text-align:center}
/* cartes */
.carte{background:var(--carte);border-radius:30px;padding:28px 32px 26px;box-shadow:0 10px 30px rgba(6,40,70,.22)}
.colonnes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));gap:22px;align-items:start}
.titre{margin:0 0 4px;padding:0 0 14px;font-size:1.12rem;font-weight:400;text-transform:uppercase;letter-spacing:.01em;display:flex;gap:14px;align-items:flex-start;border-bottom:2px dotted var(--bleu);text-wrap:balance}
.titre em{font-style:normal;color:var(--corail)}
.titre svg{width:20px;height:20px;color:var(--bleu);flex:none;margin-top:3px}
.date{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--encre-doux)}
.neuf{font-style:normal;color:var(--corail);font-size:.78rem;font-weight:700;margin-right:6px;white-space:nowrap}
/* listes à puces bleues */
.liste{list-style:none;margin:0;padding:0}
.liste li+li{border-top:1px solid var(--trait)}
.ligne{width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:15px 8px 15px 34px;position:relative;display:flex;flex-direction:column;gap:3px;border-radius:12px;transition:background .12s,padding .12s}
.ligne::before{content:"";position:absolute;left:8px;top:24px;width:9px;height:9px;border-radius:50%;background:var(--bleu);box-shadow:0 0 0 4px rgba(32,145,208,.16)}
.ligne:hover,.ligne:focus-visible{background:#fff;padding-left:40px}
.ligne:hover .nom{color:var(--corail)}
.nom{font-size:1.08rem;line-height:1.3}
.nom b{font-weight:700;color:var(--bleu);margin-right:6px;font-variant-numeric:tabular-nums}
.extrait{font-size:.92rem;color:#56627a;margin-top:3px}
mark{background:rgba(243,117,55,.25);color:inherit;border-radius:3px;padding:0 2px}
.approx{font-style:normal;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--corail)}
.vide{color:#56627a;margin:14px 0 0}
/* filtres */
.filtres{display:flex;flex-direction:column;gap:8px}
.filtres:empty{display:none}
.rangee{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rangee>span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.85);min-width:88px}
.puce{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:700}
.puce:hover{background:rgba(255,255,255,.3)}
.puce[aria-pressed="true"]{background:var(--chaud)}
/* liens et bandeau du document */
.lien{background:none;border:0;padding:0;color:#fff;font-weight:700;cursor:pointer;text-align:left}
.lien:hover{text-decoration:underline}
.barre{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.barre .date{color:rgba(255,255,255,.8)}
.bandeau{background:var(--chaud);color:#fff;border-radius:30px;padding:26px 32px;box-shadow:0 10px 30px rgba(6,40,70,.22)}
.bandeau .date{color:rgba(255,255,255,.85)}
.bandeau h1{margin:6px 0 6px;font-size:clamp(1.4rem,3.6vw,2rem);font-weight:700;line-height:1.2;text-wrap:balance}
.bandeau p{margin:0;font-size:.92rem;opacity:.92}
.bandeau a{color:#fff}
/* fiche d'étape */
.chapitre .titre{font-size:1.3rem;text-transform:none;font-weight:700}
.chapitre .titre b{color:var(--corail);margin-right:4px}
.essentiel{max-width:70ch;padding-top:16px}
.essentiel h4{margin:22px 0 8px;font-size:.86rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--corail)}
.essentiel h4:first-child{margin-top:0}
.essentiel p{margin:0 0 10px}
.essentiel ul,.essentiel ol{margin:0 0 12px;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.essentiel ul{list-style:none;padding-left:0}
.essentiel ul li{position:relative;padding-left:22px}
.essentiel ul li::before{content:"";position:absolute;left:2px;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--bleu)}
.essentiel ol li::marker{font-weight:700;color:var(--bleu)}
.essentiel .alerte,.essentiel .note{background:#fff;border-left:5px solid var(--corail);border-radius:0 14px 14px 0;padding:11px 16px}
.essentiel .note{border-left-color:var(--bleu)}
.origine{margin-top:22px;padding-top:16px;border-top:2px dotted var(--bleu)}
.origine>span{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--encre-doux);margin-bottom:12px}
.pages{display:flex;flex-direction:column;gap:14px}
.page{border:1px solid var(--trait);border-radius:16px;overflow:hidden;background:#fff;padding:0;cursor:zoom-in;display:block;width:100%}
.page img{width:100%}
.legende{font-size:.74rem;color:var(--encre-doux);margin:5px 4px 0}
/* précédent / suivant */
.suite{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tuile{border:0;cursor:pointer;background:var(--chaud);color:#fff;border-radius:22px;padding:14px 22px;display:flex;flex-direction:column;gap:2px;text-align:left;box-shadow:0 8px 22px rgba(6,40,70,.22);transition:transform .12s}
.tuile:hover{transform:translateY(-3px)}
.tuile.droite{text-align:right;align-items:flex-end}
.tuile .desc{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;opacity:.9}
.tuile .lbl{font-weight:700;line-height:1.25}
.aide-clavier{font-size:.78rem;color:rgba(255,255,255,.7);text-align:center;margin:0}
/* visionneuse */
#loupe{position:fixed;inset:0;background:rgba(6,30,52,.94);display:none;z-index:10;overflow:auto;padding:56px 12px 20px;cursor:zoom-out}
#loupe.ouvert{display:block}
#loupe img{margin:0 auto;background:#fff;max-width:none;width:min(1400px,100%);cursor:zoom-in;border-radius:8px}
#loupe.grand img{width:1400px;cursor:zoom-out}
#loupe button{position:fixed;top:12px;right:16px;background:var(--chaud);color:#fff;border:0;border-radius:999px;padding:8px 20px;font-weight:700;cursor:pointer}
.apparait{animation:apparait .25s ease}
@keyframes apparait{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (hover:none){.aide-clavier{display:none}}
@media (max-width:700px){
  body{font-size:16px}
  header{padding:10px 10px 0}
  .marque{padding:10px 16px;font-size:.9rem}
  .cherche input{padding:10px 40px 10px 16px}
  main{padding:18px 10px 32px;gap:16px}
  .carte,.bandeau{border-radius:22px;padding:20px 18px}
  .suite{grid-template-columns:1fr}
  #loupe{padding:52px 0 12px}
}
@media (max-width:420px){.marque{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.apparait{animation:none}.ligne,.tuile{transition:none}}

/* finition : profondeur douce, hiérarchie nette, micro-interactions */
body{background:
  radial-gradient(900px 520px at 12% -8%,rgba(255,255,255,.16),transparent 62%),
  radial-gradient(760px 520px at 105% 18%,rgba(239,89,154,.14),transparent 60%),
  linear-gradient(125deg,#2191d0 0%,#15699f 46%,#0c446f 100%) fixed;background-color:#15699f;-webkit-font-smoothing:antialiased}
header{padding-top:16px}
.tete{max-width:1040px;background:rgba(32,145,208,.72);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.22);box-shadow:0 10px 30px rgba(6,40,70,.28),inset 0 1px 0 rgba(255,255,255,.25)}
.cherche input{padding:13px 48px 13px 24px;box-shadow:inset 0 0 0 1px rgba(13,77,125,.06);transition:box-shadow .15s}
.cherche input:focus{outline:none;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 0 6px rgba(240,98,90,.55)}
.marque{padding:13px 28px;letter-spacing:.01em;box-shadow:0 6px 16px rgba(239,89,154,.35);transition:transform .15s,box-shadow .15s}
.marque:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(239,89,154,.45)}
main,footer{max-width:1040px}
main{gap:24px;padding-top:34px}
.hero{color:#fff;padding:6px 6px 2px}
.hero h1{margin:0;font-size:clamp(2rem,5vw,3rem);font-weight:900;letter-spacing:-.02em;line-height:1.05}
.hero p{margin:10px 0 0;font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;opacity:.82}
.carte{background:#fff;border-radius:28px;padding:30px 34px 22px;border:1px solid rgba(255,255,255,.6);box-shadow:0 1px 2px rgba(6,40,70,.08),0 12px 28px rgba(6,40,70,.16),0 32px 64px rgba(6,40,70,.12)}
.titre{font-size:.95rem;font-weight:700;letter-spacing:.09em;padding-bottom:16px;border-bottom:1px dashed rgba(32,145,208,.55);align-items:center}
.titre svg{margin-top:0;width:18px;height:18px}
.date{letter-spacing:.08em;font-size:.68rem}
.liste li+li{border-top:1px solid #eef1f5}
.ligne{padding:17px 44px 17px 38px;border-radius:16px;transition:background .15s,transform .15s}
.ligne::before{top:26px;width:8px;height:8px;left:12px;box-shadow:0 0 0 5px rgba(32,145,208,.12);transition:box-shadow .15s,background .15s}
.ligne::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2px solid var(--corail);border-top:2px solid var(--corail);transform:translate(-6px,-50%) rotate(45deg);opacity:0;transition:opacity .15s,transform .15s}
.ligne:hover,.ligne:focus-visible{background:#f4f8fc;padding-left:38px}
.ligne:hover::before{background:var(--corail);box-shadow:0 0 0 5px rgba(240,98,90,.14)}
.ligne:hover::after,.ligne:focus-visible::after{opacity:1;transform:translate(0,-50%) rotate(45deg)}
.ligne:hover .nom{color:var(--encre)}
.nom{font-size:1.1rem;font-weight:700;letter-spacing:-.005em}
.neuf{font-size:.66rem;letter-spacing:.08em;background:rgba(240,98,90,.12);border-radius:999px;padding:3px 9px;vertical-align:2px;margin-right:8px}
/* étapes : pastille numérotée à la place de la puce */
.etape{padding-left:62px;justify-content:center;min-height:62px}
.etape::before{display:none}
.etape:hover,.etape:focus-visible{padding-left:62px}
.etape .nom{font-weight:400}
.etape .nom b{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:#eaf4fb;color:var(--bleu);display:grid;place-items:center;margin:0;font-size:.95rem;transition:background .15s,color .15s}
.etape:hover .nom b,.etape:focus-visible .nom b{background:var(--chaud);color:#fff}
.touche .nom b{color:var(--corail)}
.extrait{line-height:1.45}
.puce{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);font-weight:400;transition:background .15s}
.puce[aria-pressed="true"]{border-color:transparent;font-weight:700}
.lien{opacity:.92;font-size:.92rem;letter-spacing:.01em}
.bandeau{position:relative;overflow:hidden;border-radius:28px;padding:34px 38px;box-shadow:0 12px 28px rgba(6,40,70,.18),0 32px 64px rgba(239,89,154,.18)}
.bandeau::before{content:"";position:absolute;right:-90px;top:-150px;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.13)}
.bandeau::after{content:"";position:absolute;right:70px;bottom:-190px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.09)}
.bandeau>*{position:relative}
.bandeau h1{font-weight:900;letter-spacing:-.015em;font-size:clamp(1.5rem,4vw,2.3rem);margin:10px 0 10px;max-width:22ch}
.bandeau p{font-size:.86rem}
/* fiche d'étape */
.chapitre{padding:36px 42px 34px}
.chapitre .titre{font-size:clamp(1.3rem,3vw,1.7rem);font-weight:900;letter-spacing:-.015em;line-height:1.2;border-bottom:0;padding-bottom:0;align-items:flex-start}
.chapitre .titre svg{display:none}
.chapitre .titre b{display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;background:var(--chaud);color:#fff;font-size:.62em;margin-right:14px;vertical-align:.18em;box-shadow:0 6px 14px rgba(239,89,154,.35)}
.essentiel{padding-top:26px;font-size:1.04rem;line-height:1.6;max-width:66ch}
.essentiel h4{margin:30px 0 12px;letter-spacing:.1em;font-size:.76rem;display:flex;align-items:center;gap:12px}
.essentiel h4::after{content:"";flex:1;height:1px;background:#eef1f5}
.essentiel ol{list-style:none;padding:0;counter-reset:geste;gap:12px}
.essentiel ol li{counter-increment:geste;position:relative;padding-left:44px;min-height:30px}
.essentiel ol li::before{content:counter(geste);position:absolute;left:0;top:-1px;width:30px;height:30px;border-radius:50%;background:#eaf4fb;color:var(--bleu);font-weight:700;font-size:.86rem;display:grid;place-items:center}
.essentiel ul{gap:9px}
.essentiel ul li::before{top:.62em;width:7px;height:7px}
.essentiel .alerte,.essentiel .note{border-left:0;border-radius:16px;padding:14px 18px 14px 20px;position:relative;font-size:.98rem}
.essentiel .alerte{background:#fff4f1;box-shadow:inset 4px 0 0 var(--corail)}
.essentiel .note{background:#f1f8fd;box-shadow:inset 4px 0 0 var(--bleu)}
.origine{border-top:1px dashed rgba(32,145,208,.55);margin-top:30px;padding-top:22px}
.origine>span{letter-spacing:.1em;font-size:.68rem;font-weight:700}
.page{border-radius:18px;border:1px solid #e6ebf1;box-shadow:0 6px 18px rgba(6,40,70,.08);transition:transform .2s,box-shadow .2s}
.page:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(6,40,70,.16)}
/* précédent / suivant : cartes blanches, flèche en dégradé */
.tuile{background:#fff;color:var(--encre);border-radius:22px;padding:16px 22px;box-shadow:0 12px 28px rgba(6,40,70,.16);border:1px solid rgba(255,255,255,.6);transition:transform .15s,box-shadow .15s}
.tuile:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(6,40,70,.24)}
.tuile .desc{color:var(--corail);font-weight:700;letter-spacing:.1em;font-size:.66rem;opacity:1}
.tuile .lbl{font-size:1.02rem}
footer{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;opacity:.8;padding-top:6px}
#loupe{backdrop-filter:blur(6px)}
@media (max-width:700px){
  .carte{padding:22px 18px 14px;border-radius:24px}
  .chapitre{padding:24px 20px}
  .bandeau{padding:26px 22px;border-radius:24px}
  .ligne{padding-right:14px}.ligne::after{display:none}
  .essentiel ol li{padding-left:40px}
  .hero h1{font-size:2rem}
}
@media (prefers-reduced-motion:reduce){.page,.marque,.ligne::after{transition:none}}

/* fond bleu nuit presque uni ; le bleu vif et le dégradé rose→orange restent les accents */
body{background:
  radial-gradient(1000px 560px at 8% -10%,rgba(32,145,208,.34),transparent 64%),
  radial-gradient(720px 480px at 104% 12%,rgba(239,89,154,.13),transparent 62%),
  linear-gradient(160deg,#0f3554 0%,#0b2942 55%,#082136 100%) fixed;background-color:#0b2942}
.tete{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.14)}
.carte{border:0;box-shadow:0 1px 2px rgba(0,0,0,.2),0 14px 32px rgba(0,0,0,.26),0 36px 70px rgba(0,0,0,.2)}
.hero p,.barre .date{color:#9fc9e8;opacity:1}
.lien{color:#bfe0f5;opacity:1}
.lien:hover{color:#fff}
.puce{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2)}
.puce:hover{background:rgba(255,255,255,.16)}
.rangee>span{color:#9fc9e8}
.tuile{border:0;box-shadow:0 14px 32px rgba(0,0,0,.28)}
.tuile:hover{box-shadow:0 20px 40px rgba(0,0,0,.36)}
.bandeau{box-shadow:0 14px 32px rgba(0,0,0,.26),0 30px 70px rgba(239,89,154,.2)}
footer,.aide-clavier{color:#7fa6c4;opacity:1}
#loupe{background:rgba(5,18,31,.95)}

/* cartes et émojis : grille de cartes blanches, pictogramme dans un carré arrondi teinté */
.groupe{display:flex;flex-direction:column;gap:16px}
.surtitre{margin:0;display:flex;align-items:center;gap:10px;color:#fff;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em}
.surtitre em{font-style:normal;color:#ff9d7e}
.surtitre svg{width:16px;height:16px;color:var(--bleu)}
.surtitre::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.28),transparent)}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:16px}
.emoji{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:1.65rem;line-height:1;background:linear-gradient(145deg,#eaf4fb,#f4eef6);box-shadow:inset 0 0 0 1px rgba(32,145,208,.1);transition:transform .2s cubic-bezier(.3,1.4,.5,1),background .2s}
.doc,.pas{position:relative;text-align:left;cursor:pointer;border:0;background:#fff;border-radius:26px;display:flex;gap:16px;box-shadow:0 1px 2px rgba(0,0,0,.2),0 12px 28px rgba(0,0,0,.24);transition:transform .18s,box-shadow .18s;overflow:hidden}
.doc::after,.pas::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--chaud);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.doc:hover,.doc:focus-visible,.pas:hover,.pas:focus-visible{transform:translateY(-4px);box-shadow:0 2px 4px rgba(0,0,0,.2),0 22px 44px rgba(0,0,0,.34)}
.doc:hover::after,.doc:focus-visible::after,.pas:hover::after,.pas:focus-visible::after{transform:scaleX(1)}
.doc:hover .emoji,.pas:hover .emoji{transform:scale(1.1) rotate(-6deg)}
.doc{padding:24px 24px 22px;align-items:flex-start;min-height:150px}
.doc .emoji{width:64px;height:64px;border-radius:20px;font-size:1.9rem}
.corps{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.doc .nom{font-size:1.2rem;font-weight:900;letter-spacing:-.01em;line-height:1.22;padding-right:26px}
.resume{font-size:.93rem;color:#5b6678;line-height:1.4}
.doc .date{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 0}
.doc .neuf{background:var(--chaud);color:#fff;letter-spacing:.06em;padding:3px 10px;font-size:.62rem;text-transform:uppercase}
.fleche{position:absolute;right:22px;top:26px;width:10px;height:10px;border-right:2.5px solid var(--corail);border-top:2.5px solid var(--corail);transform:rotate(45deg);transition:transform .18s}
.doc:hover .fleche{transform:translateX(4px) rotate(45deg)}
.grille:not(.etapes){grid-template-columns:repeat(auto-fill,minmax(min(440px,100%),1fr))}
.grille.etapes{grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:14px}
.pas{padding:16px 18px;align-items:center;border-radius:22px;min-height:88px}
.pas .nom{font-size:1.02rem;font-weight:700;line-height:1.25;letter-spacing:0}
.pas .date{color:var(--bleu);font-weight:700}
.pas .corps{gap:3px}
.bandeau{display:grid;grid-template-columns:auto 1fr;column-gap:22px;align-items:center}
.bandeau .emoji{grid-row:1/4;width:84px;height:84px;border-radius:26px;font-size:2.5rem;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 10px 24px rgba(0,0,0,.12);backdrop-filter:blur(4px)}
.bandeau h1{margin:4px 0 6px}
.chapitre .titre{align-items:center;gap:18px}
.chapitre .titre .emoji{width:64px;height:64px;border-radius:20px;font-size:1.9rem}
.chapitre .titre small{display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--corail);margin-bottom:4px}
.touche .nom{font-weight:700}
@media (max-width:700px){
  .doc{padding:18px;border-radius:22px;min-height:0}.doc .emoji{width:52px;height:52px;font-size:1.5rem;border-radius:16px}
  .bandeau{grid-template-columns:1fr}.bandeau .emoji{grid-row:auto;width:60px;height:60px;font-size:1.8rem;border-radius:18px;margin-bottom:10px}
  .chapitre .titre{gap:12px}.chapitre .titre .emoji{width:48px;height:48px;font-size:1.4rem;border-radius:14px}
}
@media (prefers-reduced-motion:reduce){.doc,.pas,.emoji,.doc::after,.pas::after,.fleche{transition:none}}
</style>
</head>
<body>
<header>
  <div class="tete">
    <label class="cherche" for="q"><input id="q" type="search" placeholder="Rechercher un mode d'emploi" autocomplete="off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></label>
    <button class="marque" id="accueil" type="button">Modes d'emploi</button>
  </div>
</header>
<main id="vue"></main>
<footer>ASMT 65. Document interne, destiné aux collaborateurs.</footer>
<div id="loupe" role="dialog" aria-label="Page agrandie"><button type="button">Fermer</button><img alt=""></div>
<script src="data.js"></script>
<script>
const DOCS=(window.HUB&&HUB.docs)||[];
const E={q:"",logiciel:"",thematique:"",public:""};
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plat=t=>String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g," ");
const jour=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}catch(e){return d}};
const recent=d=>(Date.now()-new Date(d+"T12:00:00").getTime())<30*864e5;
const uniques=f=>[...new Set(DOCS.flatMap(f))].sort((a,b)=>a.localeCompare(b,"fr"));
// Synonymes et abréviations maison : chaque ligne est un groupe de termes équivalents. À compléter librement.
const SYNONYMES=[
  ["rdv","rendez-vous","rendez vous"],
  ["fe","fiche d'entreprise","fiche entreprise"],
  ["di","demande d'intervention"],
  ["amt","action en milieu de travail"],
  ["pj","piece jointe","document"],
  ["agenda","planning","calendrier"],
  ["supprimer","effacer","annuler"],
  ["modifier","changer","corriger"],
  ["deconnecter","deconnexion","fermeture de session"],
  ["salarie","travailleur"],
  ["adherent","entreprise","employeur"],
  ["vehicule","voiture"],
  ["telecharger","joindre","charger"]
].map(g=>g.map(plat));
const VOCAB=new Set(),COURTS=new Set();
DOCS.forEach(d=>d.chapitres.forEach(c=>{c._p=plat(c.recherche);c._t=plat(c.titre);c._m=new Set(c._p.split(/[^a-z0-9]+/).filter(w=>w.length>2));c._m.forEach(w=>VOCAB.add(w));c._p.split(/[^a-z0-9]+/).forEach(w=>{if(w.length===2||w.length===3)COURTS.add(w)})}));
function distance(a,b,max){
  if(Math.abs(a.length-b.length)>max)return max+1;
  let pp=null,p=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const c=[i];let mini=i;
    for(let j=1;j<=b.length;j++){
      let v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
      if(pp&&i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,pp[j-2]+1);
      c[j]=v;if(v<mini)mini=v;
    }
    if(mini>max)return max+1;
    pp=p;p=c;
  }
  return p[b.length];
}
const memo=new Map();
// Pour un mot tapé : ses formes exactes (lui-même + synonymes) et, à défaut, les mots proches du vocabulaire.
function formes(m){
  if(memo.has(m))return memo.get(m);
  const exactes=new Set([m]);
  SYNONYMES.forEach(g=>{if(g.includes(m))g.forEach(x=>exactes.add(x))});
  const proches=new Set();
  if(m.length>=4){
    const max=m.length>=8?2:1;
    VOCAB.forEach(w=>{if(w[0]===m[0]&&!w.includes(m)&&Math.min(distance(m,w,max),w.length>m.length?distance(m,w.slice(0,m.length),max):9)<=max)proches.add(w)});
  }
  const r={exactes:[...exactes],proches:[...proches]};memo.set(m,r);return r;
}
// Score d'une étape pour la requête, ou null si un mot manque. Renvoie aussi les formes trouvées, pour le surlignage.
function evaluer(c,mots){
  let score=0,approx=false;const vus=[];
  for(const m of mots){
    const f=formes(m);let s=0;
    for(const x of f.exactes){
      const entier=new RegExp("(^|[^a-z0-9])"+x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"($|[^a-z0-9])").test(c._p);
      const sigle=x.length<=3&&(COURTS.has(x)||SYNONYMES.some(g=>g.includes(x)));
      const debut=entier||(sigle?false:x.length<=3?new RegExp("(^|[^a-z0-9])"+x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(c._p):c._p.includes(x));
      if(debut){vus.push(x);s=Math.max(s,(x===m?10:7)+(entier?5:0)+(c._t.includes(x)?8:0))}
    }
    if(!s){for(const w of f.proches){if(c._m.has(w)){vus.push(w);s=Math.max(s,3+(c._t.includes(w)?4:0))}}if(s)approx=true}
    if(!s)return null;
    score+=s;
  }
  return {score,approx,vus};
}

function route(){const h=decodeURIComponent(location.hash.slice(1));if(!h.startsWith("doc-"))return{slug:"",ch:""};const i=h.indexOf("--");return i<0?{slug:h.slice(4),ch:""}:{slug:h.slice(4,i),ch:h.slice(i+2)}}
function aller(slug,chapitre){const h=slug?"#doc-"+slug+(chapitre?"--"+chapitre:""):"#accueil";if(location.hash===h)rendre();else location.hash=h}

function rangee(nom,cle,valeurs){
  if(valeurs.length<2)return "";
  return `<div class="rangee"><span>${nom}</span>${valeurs.map(v=>`<button type="button" class="puce" data-filtre="${cle}" data-val="${esc(v)}" aria-pressed="${E[cle]===v}">${esc(v)}</button>`).join("")}</div>`;
}
function extrait(c,mots){
  const brut=c.recherche,p=c._p;let i=-1;
  for(const m of mots){i=p.indexOf(m);if(i>=0)break}
  if(i<0)i=0;
  const a=Math.max(0,i-70),b=Math.min(brut.length,i+150);
  let s=(a>0?"… ":"")+brut.slice(a,b)+(b<brut.length?" …":"");
  mots.forEach(m=>{if(m.length>1)s=s.replace(new RegExp("("+m.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/e/g,"[eéèêë]").replace(/a/g,"[aàâ]").replace(/u/g,"[uùû]").replace(/i/g,"[iîï]").replace(/o/g,"[oô]").replace(/c/g,"[cç]")+")","gi"),"\u0001$1\u0002")});
  s=esc(s).replace(/\u0001/g,"<mark>").replace(/\u0002/g,"</mark>");
  return s;
}
const EPINGLE='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.5 2.5 21.5 9.5l-2 .6-3.3 3.3.4 4.6-1.5 1.5-4-4-5.6 5.6-1-1L10 14.5l-4-4L7.5 9l4.6.4 3.3-3.3z"/></svg>';
const jourCourt=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("fr-FR")}catch(e){return d}};
function accueil(){
  const mots=plat(E.q).split(/\s+/).filter(m=>m.length>1);
  const garde=d=>(!E.logiciel||d.logiciel===E.logiciel)&&(!E.thematique||d.thematique===E.thematique)&&(!E.public||d.publics.includes(E.public)||d.publics.includes("Tous"));
  const docs=DOCS.filter(garde);
  let h=`<div class="filtres">${rangee("Logiciel","logiciel",uniques(d=>[d.logiciel]))}${rangee("Thématique","thematique",uniques(d=>[d.thematique]))}${rangee("Je suis","public",uniques(d=>d.publics).filter(p=>p!=="Tous"))}</div>`;
  if(mots.length){
    const touches=[];
    docs.forEach(d=>d.chapitres.forEach((c,i)=>{const e=evaluer(c,mots);if(e)touches.push({d,c,i,e})}));
    touches.sort((a,b)=>b.e.score-a.e.score);
    h+=`<section class="carte apparait"><h1 class="titre">${EPINGLE}<span>Résultats <em>de la recherche</em></span></h1>`;
    h+=touches.length?`<ul class="liste">${touches.map(t=>`<li><button type="button" class="ligne touche" data-doc="${esc(t.d.slug)}" data-ch="${esc(t.c.id)}"><span class="nom">${t.c.icone?t.c.icone+" ":""}${esc(t.c.titre)}</span><span class="date">Étape ${t.i+1} · ${esc(t.d.logiciel)} · ${esc(t.d.titre)}</span><span class="extrait">${extrait(t.c,t.e.vus)}</span>${t.e.approx?`<em class="approx">Orthographe approchante</em>`:""}</button></li>`).join("")}</ul>`
      :`<p class="vide">Aucune étape ne contient « ${esc(E.q.trim())} ». Essayez un seul mot, ou un terme affiché à l'écran dans le logiciel.</p>`;
    h+=`</section>`;
  }else if(!docs.length){
    h+=`<section class="carte"><p class="vide" style="margin:0">${DOCS.length?"Aucun mode d'emploi ne correspond à ces filtres.":"Aucun mode d'emploi n'est encore publié."}</p></section>`;
  }else{
    const groupes=[...new Set(docs.map(d=>d.logiciel))].sort((a,b)=>a.localeCompare(b,"fr"));
    const nbE=docs.reduce((s,d)=>s+d.chapitres.length,0);
    h+=`<div class="hero apparait"><h1>Modes d'emploi</h1><p>${docs.length} document${docs.length>1?"s":""} · ${nbE} étapes · mis à jour le ${jourCourt(docs.map(d=>d.date).sort().pop())}</p></div>${groupes.map(g=>`<section class="groupe apparait"><h2 class="surtitre">${EPINGLE}<span>Modes d'emploi <em>${esc(g)}</em></span></h2><div class="grille">${docs.filter(d=>d.logiciel===g).map(d=>`<button type="button" class="doc fiche" data-doc="${esc(d.slug)}"><span class="emoji">${d.icone||"📘"}</span><span class="corps"><span class="nom">${esc(d.titre)}</span><span class="resume">${esc(d.resume||"")}</span><span class="date">${recent(d.date)?`<em class="neuf">${d.version>1?"Mis à jour":"Nouveau"}</em>`:""}${esc(d.thematique)} · ${d.chapitres.length} étapes · ${jourCourt(d.date)}</span></span><span class="fleche" aria-hidden="true"></span></button>`).join("")}</div></section>`).join("")}`;
  }
  $("#vue").innerHTML=h;
}
function chapitreHtml(d,c,i){
  return `<section class="carte chapitre apparait"><h1 class="titre"><span class="emoji">${c.icone||i+1}</span><span><small>Étape ${i+1} sur ${d.chapitres.length}</small>${esc(c.titre)}</span></h1><div class="essentiel">${c.essentiel}</div>${c.pages.length?`<div class="origine"><span>Captures d'écran du document d'origine</span><div class="pages">${c.pages.map(p=>`<div><button type="button" class="page" data-img="docs/${esc(d.slug)}/p${String(p.n).padStart(2,"0")}.webp" aria-label="Agrandir la page ${p.n}"><img loading="lazy" width="${p.l}" height="${p.h}" src="docs/${esc(d.slug)}/p${String(p.n).padStart(2,"0")}.webp" alt="Page ${p.n} du document d'origine"></button><p class="legende">Page ${p.n} sur ${d.nbPages}. Cliquez pour agrandir.</p></div>`).join("")}</div></div>`:""}</section>`;
}
function document_(d){
  const n=d.chapitres.length,i=d.chapitres.findIndex(c=>c.id===route().ch);
  let h;
  if(i<0){
    h=`<button type="button" class="lien" data-doc="">← Tous les modes d'emploi</button>
    <div class="bandeau apparait"><span class="emoji">${d.icone||"📘"}</span><span class="date">${esc(d.logiciel)} · ${esc(d.thematique)}</span><h1>${esc(d.titre)}</h1><p>Version ${d.version} du ${jourCourt(d.date)}${d.note?" · "+esc(d.note):""}${d.pdf?` · <a href="docs/${esc(d.slug)}/original.pdf">Télécharger le PDF d'origine</a>`:""}</p></div>
    <section class="groupe apparait"><h2 class="surtitre">${EPINGLE}<span>Que voulez-vous <em>faire ?</em></span></h2><div class="grille etapes">${d.chapitres.map((c,k)=>`<button type="button" class="pas etape" data-ouvrir="${esc(c.id)}"><span class="emoji">${c.icone||k+1}</span><span class="corps"><span class="date">Étape ${k+1}</span><span class="nom">${esc(c.titre)}</span></span></button>`).join("")}</div></section>`;
  }else{
    const c=d.chapitres[i],av=d.chapitres[i-1],ap=d.chapitres[i+1];
    h=`<div class="barre"><button type="button" class="lien" data-ouvrir="">← Toutes les étapes</button><span class="date">${esc(d.titre)} · ${i+1} sur ${n}</span></div>${chapitreHtml(d,c,i)}
    <div class="suite">${av?`<button type="button" class="tuile" data-ouvrir="${esc(av.id)}"><span class="desc">← Étape précédente</span><span class="lbl">${av.icone||""} ${esc(av.titre)}</span></button>`:"<span></span>"}${ap?`<button type="button" class="tuile droite" data-ouvrir="${esc(ap.id)}"><span class="desc">Étape suivante →</span><span class="lbl">${ap.icone||""} ${esc(ap.titre)}</span></button>`:""}</div><p class="aide-clavier">Flèches ← → pour changer d'étape · / pour chercher</p>`;
  }
  $("#vue").innerHTML=h;scrollTo(0,0);
}
function rendre(){
  const d=DOCS.find(x=>x.slug===route().slug);
  document.body.classList.toggle("interieur",!!d&&!E.q);
  document.title=d?d.titre+" – Modes d'emploi ASMT 65":"Modes d'emploi ASMT 65";
  if(d&&!E.q)document_(d);else accueil();
  if(document.activeElement!==$("#q")){const t=$("#vue").querySelector("h1,h2");if(t){t.tabIndex=-1;t.focus({preventScroll:true})}}
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");
  if(ev.target.closest("#loupe")){const l=$("#loupe");if(ev.target.tagName==="IMG"&&!l.classList.contains("grand")){l.classList.add("grand");return}l.classList.remove("ouvert","grand");return}
  if(!b)return;
  if(b.id==="accueil"){E.q="";$("#q").value="";E.logiciel=E.thematique=E.public="";aller("")}
  else if(b.dataset.filtre){const k=b.dataset.filtre;E[k]=E[k]===b.dataset.val?"":b.dataset.val;accueil()}
  else if("ouvrir" in b.dataset)aller(route().slug,b.dataset.ouvrir);
  else if(b.dataset.img){const l=$("#loupe");l.querySelector("img").src=b.dataset.img;l.classList.add("ouvert");l.scrollTop=0}
  else if("doc" in b.dataset){E.q="";$("#q").value="";aller(b.dataset.doc,b.dataset.ch)}
});
document.addEventListener("keydown",ev=>{
  const l=$("#loupe"),q=$("#q");
  if(ev.key==="Escape"){if(l.classList.contains("ouvert")){l.classList.remove("ouvert","grand");return}if(E.q){E.q="";q.value="";rendre()}return}
  if(ev.target===q||l.classList.contains("ouvert")||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  if(ev.key==="/"){ev.preventDefault();q.focus();return}
  if(ev.key==="ArrowRight"||ev.key==="ArrowLeft"){const b=document.querySelector(ev.key==="ArrowRight"?".suite .droite":".suite .tuile:not(.droite)");if(b)b.click()}
});
let attente;
$("#q").addEventListener("input",ev=>{clearTimeout(attente);attente=setTimeout(()=>{E.q=ev.target.value;if(E.q.trim())accueil();else rendre()},120)});
addEventListener("hashchange",rendre);
rendre();
</script>
</body>
